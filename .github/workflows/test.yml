name: test

on:
  push:
    branches: [main, 'automation/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
        env:
          UPSTASH_REDIS_REST_URL: ''
          UPSTASH_REDIS_REST_TOKEN: ''
          BOT_TOKEN: '123456:CI_TEST_TOKEN'
          ADMIN_ID: '999999999'
          WEBHOOK_SECRET: 'ci-test-secret'
