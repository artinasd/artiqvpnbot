name: account-feature
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch account section
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='api/index.js';
          let s=fs.readFileSync(p,'utf8');
          const helper=`
async function showAccount(ctx) {
  const config = await getConfig();
  const orders = await storage.listUserOrders(ctx.from.id, 100);
  const subscriptions = orders.filter((o) => o.fulfillmentStatus === 'FULFILLED' && o.pasarguardUserId && o.subscriptionUrl);
  if (!subscriptions.length) return ctx.reply(await getMessage('accountNoSubscription'));
  const buttons = subscriptions.map((order) => {
    const kind = order.planId === 'test' ? '🧪 تست' : '📦 خرید';
    return [Markup.button.callback(`${kind} · ${order.planName || 'اشتراک'} · ${order.generatedPasarguardUsername || order.orderId}`, `account_sub_${order.orderId}`)];
  });
  return ctx.reply(await getMessage('accountSubscriptionList', { count: subscriptions.length }), Markup.inlineKeyboard(buttons));
}
async function showAccountSubscription(ctx, orderIdValue) {
  const config = await getConfig();
  const order = await storage.getOrder(orderIdValue);
  if (!order || String(order.telegramUserId) !== String(ctx.from.id) || order.fulfillmentStatus !== 'FULFILLED' || !order.pasarguardUserId) return ctx.reply(await getMessage('accountSubscriptionNotFound'));
  try {
    const current = await pasarguard.getUserById(order.pasarguardUserId);
    const traffic = current.data_limit === 0 ? 'نامحدود' : formatBytes(Number(current.data_limit || 0));
    const used = current.used_traffic != null ? formatBytes(Number(current.used_traffic)) : 'در دسترس نیست';
    const text = `📦 <b>${escapeHtml(order.planName || 'اشتراک')}</b>\n\n👤 نام: <code>${escapeHtml(current.username || order.generatedPasarguardUsername || '-')}</code>\n📊 حجم: ${escapeHtml(traffic)}\n📈 مصرف: ${escapeHtml(used)}\n⏳ انقضا: ${escapeHtml(current.expire || 'نامشخص')}\n📌 وضعیت: ${escapeHtml(current.status || 'نامشخص')}\n🧾 سفارش: <code>${escapeHtml(order.orderId)}</code>`;
    const url = current.subscription_url || order.subscriptionUrl;
    const rows = [[{ text: config.buttons?.copySubscription || '📋 کپی لینک اشتراک', copy_text: { text: url } }], [{ text: config.buttons?.openSubscription || '🔗 باز کردن لینک اشتراک', url }]];
    if (order.planId !== 'test') rows.push([{ text: config.buttons?.renew || '🔄 تمدید اشتراک', callback_data: `account_renew_${order.orderId}` }]);
    return ctx.reply(text, { parse_mode: 'HTML', reply_markup: { inline_keyboard: rows } });
  } catch { return ctx.reply(await getMessage('accountStatusFailure')); }
}
async function startAccountRenewal(ctx, orderIdValue) {
  const order = await storage.getOrder(orderIdValue);
  if (!order || String(order.telegramUserId) !== String(ctx.from.id) || order.fulfillmentStatus !== 'FULFILLED' || !order.pasarguardUserId) return ctx.reply(await getMessage('accountSubscriptionNotFound'));
  if (order.planId === 'test') return ctx.reply(await getMessage('testRenewUnavailable'));
  const plan = { id: order.planId, name: order.planName, service: order.service || 'tunnel', price: Number(order.price || 0), currency: order.currency || 'تومان', durationDays: Number(order.durationDays || 0), trafficBytes: Number(order.trafficLimitBytes || 0), hwidLimit: Number(order.hwidLimit || 0), type: Number(order.trafficLimitBytes || 0) === 0 ? 'unlimited' : 'traffic' };
  const config = await getConfig();
  const service = getConfiguredService(plan.service, config);
  if (!service || service.id !== 'tunnel') return ctx.reply(await getMessage('serviceUnavailable', { service_name: service ? serviceLabel(service) : 'سرویس' }));
  const renewal = await createOrderForPlan(ctx, plan);
  await storage.updateOrder(renewal.orderId, { renewal: true, renewalPasarguardUserId: order.pasarguardUserId, renewalSourceOrderId: order.orderId });
  return showPayment(ctx, { ...renewal, renewal: true, renewalPasarguardUserId: order.pasarguardUserId });
}
`;
          if(!s.includes('async function showAccount(ctx)')) s=s.replace('bot.start(async (ctx) => {',helper+'\nbot.start(async (ctx) => {');
          const re=/if \(text === \(b\.account \|\| '👤 حساب من'\)\) \{[\s\S]*?\} return next\(\);/;
          if(!re.test(s)) throw new Error('ACCOUNT_HANDLER_NOT_FOUND');
          s=s.replace(re,"if (text === (b.account || '👤 حساب من')) { await persistUser(ctx); return showAccount(ctx); } return next();");
          const cb="if (data.startsWith('service_test_')) return createTestForService(ctx, data.slice('service_test_'.length));";
          if(!s.includes("data.startsWith('account_sub_')")) s=s.replace(cb,"if (data.startsWith('account_sub_')) return showAccountSubscription(ctx, data.slice('account_sub_'.length));\n  if (data.startsWith('account_renew_')) return startAccountRenewal(ctx, data.slice('account_renew_'.length));\n  "+cb);
          fs.writeFileSync(p,s);
          NODE
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/index.js
          git commit -m 'Implement user account subscription section'
          git rm .github/workflows/account-feature.yml
          git commit -m 'Remove temporary account feature workflow'
          git push origin main
