name: CMS runtime message patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cms-runtime-messages.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply CMS runtime message wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime message lookups
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/index.js')
          s=p.read_text()
          replacements={
            "await ctx.reply('👤 نام اشتراک\\n\\nاگر می‌خواهید نام دلخواهی برای اشتراک خود انتخاب کنید، آن را وارد کنید؛ در غیر این صورت نام به صورت خودکار ساخته می‌شود.\\n\\nفقط حروف انگلیسی، اعداد، @ و _ مجاز است و نام نباید فاصله یا کاراکتر دیگری داشته باشد.', Markup.inlineKeyboard([[Markup.button.callback('⚡ نام خودکار', `auto_name_${order.orderId}`)]]));":"await ctx.reply(await getMessage('subscriptionNamePrompt'), Markup.inlineKeyboard([[Markup.button.callback(await getConfig().then(c => c.buttons?.autoName || '⚡ نام خودکار'), `auto_name_${order.orderId}`)]]));",
            "if (!user?.currentPasarguardUserId) return ctx.reply('👤 هنوز اشتراک فعالی برای حساب شما ثبت نشده است.');":"if (!user?.currentPasarguardUserId) return ctx.reply(await getMessage('accountNoSubscription'));",
            "if (!user?.currentPasarguardUserId) return ctx.reply('👤 هنوز اشتراک فعالی برای حساب شما ثبت نشده است.'); try {":"if (!user?.currentPasarguardUserId) return ctx.reply(await getMessage('accountNoSubscription')); try {",
            "return ctx.reply('❌ دریافت وضعیت اشتراک در حال حاضر ممکن نیست. لطفاً کمی بعد دوباره تلاش کنید.');":"return ctx.reply(await getMessage('accountStatusFailure'));",
            "await ctx.reply('❌ دریافت وضعیت اشتراک در حال حاضر ممکن نیست. لطفاً کمی بعد دوباره تلاش کنید.');":"await ctx.reply(await getMessage('accountStatusFailure'));",
            "return ctx.reply('⏳ درخواست تست شما در حال پردازش است.');":"return ctx.reply(await getMessage('testProcessingLock'));",
            "const paymentText = `${paymentTitle}\\n\\n📦 <b>سرویس:</b> ${escapeHtml(order.planName)}\\n💰 <b>مبلغ قابل پرداخت:</b> ${Number(order.price).toLocaleString('en-US')} ${escapeHtml(currency)}\\n\\n🏦 <b>شماره کارت</b>\\n<code>${formattedCard}</code>\\n👤 <b>به نام:</b> ${escapeHtml(holder)}${bankDetails ? `\\n\\n${escapeHtml(bankDetails)}\\n` : ''}\\n${receiptInstructions}\\n\\n${paymentFooter}`;":"const paymentText = `${paymentTitle}\\n\\n📦 <b>سرویس:</b> ${escapeHtml(order.planName)}\\n💰 <b>مبلغ قابل پرداخت:</b> ${Number(order.price).toLocaleString('en-US')} ${escapeHtml(currency)}\\n\\n🏦 <b>شماره کارت</b>\\n<code>${formattedCard}</code>\\n👤 <b>به نام:</b> ${escapeHtml(holder)}${bankDetails ? `\\n\\n${escapeHtml(bankDetails)}\\n` : ''}\\n${receiptInstructions}\\n\\n${paymentFooter}`; const copyCardText = (config.buttons?.copyCard || '📋 کپی شماره کارت');"
          }
          changed=False
          for a,b in replacements.items():
            if a in s:
              s=s.replace(a,b); changed=True
          s=s.replace("{ text: '📋 کپی شماره کارت', copy_text: { text: card } }","{ text: copyCardText, copy_text: { text: card } }")
          if not changed:
            raise SystemExit('No expected runtime patterns found; refusing unsafe commit')
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/cms-runtime-messages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/index.js .github/workflows/cms-runtime-messages.yml
          git commit -m 'Apply CMS runtime message wiring'
          git push
